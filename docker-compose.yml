services:
  app:
    build:
      dockerfile_inline: |
        FROM composer:2 AS build
        WORKDIR /app
        COPY composer.json composer.lock ./
        RUN composer install --no-dev --optimize-autoloader --no-scripts --no-progress

        FROM php:8.4-cli
        RUN apt-get update && apt-get install -y --no-install-recommends libpq-dev \
            && docker-php-ext-install pdo_pgsql \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY --from=build /app/vendor ./vendor
        COPY src ./src
        EXPOSE 8000
        CMD ["php", "-S", "0.0.0.0:8000", "src/index.php"]
    container_name: basic-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env

  db:
    image: postgres:17
    container_name: basic-backend-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: basic_backend
      POSTGRES_USER: basic_backend
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basic_backend -d basic_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
